<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Henny Penny" rel="stylesheet"/>
    <title>Q4Quiz2</title>
    <link rel="stylesheet" href="styles.css" type="text/css"/>
  </head>
  <body class="mt-5">
    <div class="container text-center">
      <h1 class="mx-auto title rounded-3">SCORE ANALYZER</h1>
      <details class="mt-3">
        <summary><strong>Click Me</strong></summary>
        <i>Input your grades in the following subjects found below.</i>
      </details>
      <br/>

      <!-- Centered Row for Subjects -->
      <div class="row justify-content-center text-center mt-5">
        <!-- Science -->
        <div class="col-12 col-sm-6 col-md-3 mb-4 mx-5">
          <img src="https://marketplace.canva.com/EAE-Fj_3tSU/1/0/1236w/canva-science-notebook-cover-qQN9vOBTwmQ.jpg" class="img-fluid shadow" style="height: 350px"/>
          <div class="message-box mt-2 mx-auto">
            <input type="text" id="num1" class="form-control" placeholder="Enter Science Grade"/>
          </div>
        </div>

        <!-- Math -->
        <div class="col-12 col-sm-6 col-md-3 mb-4 mx-5">
          <img src="https://i.pinimg.com/564x/80/56/1e/80561e8c9748a629f2d75ac4446d45da.jpg" class="img-fluid shadow" style="height: 350px"/>
          <div class="message-box mt-2">
            <input type="text" id="num2" class="form-control" placeholder="Enter Math Grade"/>
          </div>
        </div>

        <!-- English -->
        <div class="col-12 col-sm-6 col-md-3 mb-4 mx-5">
          <img src="https://raketcontent.com/Pink_Feminine_Notebook_Cover_20240802_184429_0000_e0595bada3.png" class="img-fluid shadow" style="height: 350px"/>
          <div class="message-box mt-2">
            <input type="text" id="num3" class="form-control" placeholder="Enter Filipino Grade"/>
          </div>
        </div>
      </div>

      <!-- Button -->
      <button type="button" class="btn btn-dark mt-3 mb-5" onclick="calculate()">
        Get Rating
      </button>
    </div>

  <center><p><strong>Note:</strong> Grading Criteria and Equivalents can vary depending on school or district.</p></center>
  <hr>
    <footer class="mt-3">
      <center>
        <a href="https://docs.google.com/document/d/18GzyV6eBDFjYENMhGN8FaKRgCRAqsAHgAs6Mj6u-iFU/edit?usp=sharing">References</a>
      </center>
      <br>
      <center><p>@Sam Luna (AY 2024–2025)<p></center>
      <br>
    </footer>

    <!-- Script -->
    <script src="main.js"></script>
  </body>
</html>
